name: Bug report
description: Report a problem with browserless-bap
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please report security
        vulnerabilities privately as described in [the security policy](https://github.com/browserless/bap-py/security/policy),
        not in a public issue.

        Problems with a particular website, bot detection or blocking are usually
        not bugs in this SDK — contact [support@browserless.io](mailto:support@browserless.io)
        instead.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: A minimal code sample that reproduces the problem.
      placeholder: |
        ```python
        import browserless_bap as bap
        # ...
        ```
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead, including the full traceback if there is one.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: browserless-bap==0.2.0
    validations:
      required: true
  - type: dropdown
    id: api-style
    attributes:
      label: API style
      options:
        - Async
        - Sync
        - Both
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime details
      placeholder: Python 3.12 on macOS 15
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I am using a supported version (see SECURITY.md).
          required: true
