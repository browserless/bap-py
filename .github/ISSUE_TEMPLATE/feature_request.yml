name: Feature request
description: Suggest an idea for browserless-bap
title: '[Feature]: '
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Thanks for the suggestion! Please describe what you'd like and why.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the API or behavior you'd like. Code sketches welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: input
    id: playwright
    attributes:
      label: Playwright equivalent
      placeholder: page.expose_function()
    validations:
      required: false
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
