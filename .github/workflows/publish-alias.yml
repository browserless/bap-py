name: Publish browserless alias

# Builds the `browserless` package in meta/browserless, which contains no code
# and depends on browserless-bap. Pull requests only build and check it; a
# manual run from main also uploads it to PyPI after a maintainer approves the
# `pypi-alias` deployment.
on:
  pull_request:
    branches: [main]
    paths:
      - "meta/browserless/**"
      - ".github/workflows/publish-alias.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install "build>=1.2" "twine>=6.0"
      - name: Build
        working-directory: meta/browserless
        run: python -m build
      - name: Validate distributions
        working-directory: meta/browserless
        run: twine check dist/*
      - name: Check that the wheel installs browserless-bap and ships no modules
        working-directory: meta/browserless
        run: |
          # Every wheel entry must be metadata under *.dist-info/.
          python - dist/*.whl <<'PY'
          import sys
          import zipfile

          names = zipfile.ZipFile(sys.argv[1]).namelist()
          extra = [n for n in names if ".dist-info/" not in n]
          if extra:
              raise SystemExit(f"::error::The alias wheel must contain only metadata: {extra}")
          PY
          python -m venv /tmp/alias-smoke
          /tmp/alias-smoke/bin/python -m pip install dist/*.whl
          /tmp/alias-smoke/bin/python -c "import browserless_bap, browserless_bap.sync_api"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alias-distributions
          path: meta/browserless/dist/
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi-alias
      url: https://pypi.org/project/browserless/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: alias-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
