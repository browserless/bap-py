name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  # Manual dry run: builds and checks exactly as for a release, then uploads to
  # TestPyPI instead of PyPI. Run it from main.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install development and build dependencies
        run: python -m pip install -e ".[dev]"
      - name: Require tag to match package version
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import runpy

          version = runpy.run_path("src/browserless_bap/_version.py")["__version__"]
          expected = f"v{version}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(f"release tag {actual!r} must equal {expected!r}")
          PY
      - name: Check formatting
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Type-check
        run: mypy
      - name: Run offline tests
        run: pytest -m "not e2e"
      - name: Verify schema lock
        run: python scripts/sync_schema.py --check
      - name: Verify generated files
        run: |
          python scripts/codegen.py
          git diff --exit-code -- README.md llms.txt src/browserless_bap
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Check public API compatibility
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PREVIOUS_TAG="$(
            git tag --sort=-version:refname |
              grep -Fxv "$RELEASE_TAG" |
              head -1 ||
              true
          )"
          if test -z "$PREVIOUS_TAG"; then
            echo "No prior release tag; bootstrapping API compatibility baseline."
          else
            griffe check src/browserless_bap --against "$PREVIOUS_TAG"
          fi
      - run: python -m build
      - name: Validate distributions
        run: twine check dist/*
      - name: Smoke-test wheel in a fresh environment
        run: |
          python -m venv /tmp/bap-wheel-smoke
          /tmp/bap-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/bap-wheel-smoke/bin/python -c \
            "import browserless_bap, browserless_bap.sync_api; assert not hasattr(browserless_bap, 'schema_source')"
          ! python -m zipfile -l dist/*.whl | grep -q 'mutations.graphql'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/browserless-bap/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/browserless-bap/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
