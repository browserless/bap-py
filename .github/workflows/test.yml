name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Check formatting
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Type-check
        run: mypy
      - name: Verify schema lock
        run: python scripts/sync_schema.py --check
      - name: Verify generated files
        run: |
          python scripts/codegen.py
          git diff --exit-code -- README.md llms.txt src/browserless_bap || FAIL=1
          test -z "$(git status --porcelain --untracked-files=all)" || FAIL=1
          test -z "${FAIL:-}" || {
            echo "::error::Generated files are stale. Run python scripts/codegen.py and commit the result."
            exit 1
          }

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest -m "not e2e"

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install build
      - run: python -m build
      - name: Smoke-test wheel in a fresh environment
        run: |
          python -m venv /tmp/bap-wheel-smoke
          /tmp/bap-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/bap-wheel-smoke/bin/python -c \
            "import browserless_bap, browserless_bap.sync_api; assert not hasattr(browserless_bap, 'schema_source')"
          ! python -m zipfile -l dist/*.whl | grep -q 'mutations.graphql'
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
