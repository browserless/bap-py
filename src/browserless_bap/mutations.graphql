  once the stylesheet has loaded.

  **Usage Example:**
  ```graphql
  mutation InjectStyle {
    goto(url: "https://example.com") {
      status
    }
    addStyleTag(content: "body { background: #000; }") {
      time
    }
  }
  ```

  **Field Definition:**
  """
  addStyleTag(
    """
    The URL of the stylesheet to add. One of "url" or "content" is required.
    """
    url: String

    """
    The raw CSS content of the stylesheet to add. One of "url" or "content" is required.
    """
    content: String
  ): AddStyleTagResponse

  """
  Fulfills matching requests with a canned response instead of letting them hit
  the network, mirroring the request-interceptor mocking used by the REST APIs.
  Matching follows the same glob-style URL/method/type conditions as `reject`.

  **Usage Example:**
  ```graphql
  mutation MockApi {
    fulfill(
      url: ["*/api/user"]
      status: 200
      contentType: "application/json"
      body: "{\\"name\\":\\"test\\"}"
    ) {
      time
    }
    goto(url: "https://example.com") {
      status
    }
  }
  ```

  **Field Definition:**
  """
  fulfill(
    """
    The glob-style URL pattern(s) to fulfill requests for
    """
    url: [String]

    """
    JavaScript regular-expression pattern(s) to match request URLs
    """
    regex: [String]

    """
    The HTTP Method(s) of the requests to fulfill
    """
    method: [Method]

    """
    The resource type(s) of the requests to fulfill
    """
    type: [ResourceType]

    """
    Whether to "or" the conditions together (any match fulfills) or "and" them (all must match)
    """
    operator: OperatorTypes = or

    """
    The HTTP status code to respond with. Defaults to 200
    """
    status: Int = 200

    """
    The Content-Type header to respond with
    """
    contentType: String

    """
    The response body to respond with
    """
    body: String

    """
    A base64-encoded response body. Use this instead of body for binary data.
    """
    base64Body: String

    """
    Additional response headers to respond with
    """
    headers: [HeaderInput]
  ): FulfillResponse

  """
  Returns the page's content converted to Markdown. The HTML is fetched from
  the page (optionally scoped to a selector) and converted server-side, with
  script/style/noscript/iframe nodes stripped.

  **Usage Example:**
  ```graphql
  mutation Markdownify {
    goto(url: "https://example.com") {
      status
    }
    markdown {
      markdown
    }
  }
  ```

  **Field Definition:**
  """
  markdown(
    """
    The DOM selector to scope the Markdown conversion to. Defaults to the whole document.
    """
    selector: String

    """
    The maximum amount of time, in milliseconds, to wait for the selector to appear, overriding any defaults. Default timeout is 30 seconds, or 30000.
    """
    timeout: Float

    """
    Whether or not to convert the element only if it's visible
    """
    visible: Boolean = false
  ): MarkdownResponse

  """
  Closes a Live URL created by this browser session.
  """
  closeLiveURL(
    """
    The ID of the Live URL to close
    """
    liveURLId: String!
  ): CloseLiveURLResponse!
}

type Query {
  """
  The Version of this server
  """
  version: String

  """
  The Version of the browser
  """
  browser: String
}

"""
The kind of console message, mirroring the CDP Runtime.consoleAPICalled type
(and puppeteer's ConsoleMessageType). Uncaught exceptions are reported as `error`.
"""
enum ConsoleMessageType {
  log
  debug
  info
  error
  warning
  dir
  dirxml
  table
  trace
  clear
  startGroup
  startGroupCollapsed
  endGroup
  assert
  profile
  profileEnd
  count
  timeEnd
  verbose
}

"""
The source location a console message originated from.
"""
type ConsoleMessageLocation {
  url: String
  lineNumber: Int
  columnNumber: Int
}

"""
A console message emitted by the page. Mirrors puppeteer's ConsoleMessage,
sourced from CDP Runtime.consoleAPICalled and Runtime.exceptionThrown.
"""
type ConsoleMessage {
  """
  The kind of console message.
  """
  type: ConsoleMessageType

  """
  The joined, human-readable message text (equivalent to puppeteer's msg.text()).
  """
  text: String

  """
  Each console argument, JSON-encoded and in order (equivalent to msg.args()).
  """
  args: [String]

  """
  The source location the message originated from.
  """
  location: ConsoleMessageLocation

  """
  Wall-clock milliseconds since the Unix epoch when the message was emitted.
  """
  timestamp: Float
}

"""
Long-lived, event-based streams delivered over the graphql-transport-ws
WebSocket subprotocol. Unlike the one-shot request/response mutations, a
subscription pushes a value each time the underlying page event fires, until
the client completes it or the session closes.
"""
type Subscription {
  """
  Streams console output as the page emits it. Mirrors page.on('console').
  """
  console: ConsoleMessage

  """
  Streams each network request as it is issued. Mirrors page.on('request').
  The optional filters mirror the request() mutation.
  """
  request(
    """
    Glob-like URL pattern(s) to match against.
    """
    url: [String]

    """
    HTTP method(s) to match against.
    """
    method: [Method]

    """
    Resource type(s) to match against.
    """
    type: [ResourceType]

    """
    Whether to "and" or "or" the supplied filters together.
    """
    operator: OperatorTypes = or
  ): RequestResponse

  """
  Streams each network response as it is received. Mirrors page.on('response').
  The response body is NOT fetched by default (streaming many bodies is
  expensive); request the `body` field in your selection set to trigger a
  per-event fetch.
  """
  response(
    """
    Glob-like URL pattern(s) to match against.
    """
    url: [String]

    """
    HTTP status code(s) to match against.
    """
    status: [Int]

    """
    HTTP method(s) to match against.
    """
    method: [Method]

    """
    Resource type(s) to match against.
    """
    type: [ResourceType]

    """
    Whether to "and" or "or" the supplied filters together.
    """
    operator: OperatorTypes = or
  ): ResponseResponse

  """
  Streams one completion per live URL minted by this BQL session. The stream
  remains open for later mints until unsubscribed or the session closes.
  """
  liveComplete: LiveURLCompleteEvent!
}

"""
The @export directive allows you to export a field value as a variable
that can be used in subsequent mutations within the same request.

Example:
```
mutation {
  page: goto(url: "https://example.com") {
    url @export(as: "currentUrl")
  }
  text: type(selector: "input", text: "${currentUrl}") {
    selector
  }
}
```
"""
directive @export(
  """
  The variable name to export this field value as. Can be referenced
  in subsequent mutations using ${variableName} template syntax.
  """
  as: String!
) on FIELD

"""
The reason a live URL handoff completed.
"""
enum LiveURLCompleteReason {
  timeout
  closed
  userDone
  userFailed
  viewerDisconnected
}

type LiveURLCompleteEvent {
  liveURLId: String!
  reason: LiveURLCompleteReason!
}

"""
The response returned after closing a Live URL
"""
type CloseLiveURLResponse {
  """
  The ID of the closed Live URL
  """
  liveURLId: String!
}
